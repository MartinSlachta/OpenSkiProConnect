<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSkiPro Connect - Speaker</title>
<link rel="stylesheet" href="/web/screen.css">
<style id="own-css"></style>
</head>
<body class="speaker">
<div class="sp-top">
  <div class="t" id="title">Connecting to OpenSkiPro Connect ...</div>
  <select id="group" title="Output group"></select>
  <button id="which" title="Total ranking or the ranking of the run">Total</button>
  <button id="smaller" title="Smaller letters">A-</button>
  <button id="bigger" title="Bigger letters">A+</button>
  <span id="clock"></span>
</div>
<div class="sp-main">
  <div class="sp-left" id="left"></div>
  <div class="sp-right"><div class="sp-scroll" id="right"></div></div>
</div>
<div id="card"><div class="in"></div></div>
<div id="message"><div></div></div>
<div id="offline" title="No connection to OpenSkiPro Connect"></div>
<script src="/web/common.js"></script>
<script src="/web/speaker.js"></script>
</body>
</html>
